<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>星雲防線 · Starfall Defender</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#060d1c;color:#dceafa;font:14px system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;flex-direction:column}header{width:min(1200px,98vw);display:flex;justify-content:space-between;align-items:center;padding:18px 0;color:#7f9cb4;font-size:12px;letter-spacing:2px}header b{color:#65e5ff;font-weight:600}main{width:min(1200px,98vw);aspect-ratio:3/2;position:relative;border:1px solid #233c50;box-shadow:0 30px 100px #0008}canvas{width:100%;height:100%;display:block;background:#060d1c}#loading{position:absolute;inset:0;display:flex;gap:20px;align-items:center;justify-content:center;flex-direction:column;background:#080f20}progress{accent-color:#65e5ff;width:240px}footer{max-width:1200px;padding:18px;color:#8ba4bc;line-height:1.8;text-align:center}button{background:transparent;border:1px solid #29495c;color:#65e5ff;padding:7px 12px;cursor:pointer}#error{display:none;max-width:90%;color:#ffb7ba;white-space:pre-wrap}a{color:#65e5ff}
</style>
</head>
<body>
<header><b>STARFALL DEFENDER / 星雲防線</b><button id="full">全螢幕</button></header>
<main><canvas id="unity-canvas" width="1200" height="800" tabindex="0"></canvas><div id="loading"><span>正在啟動星雲防線…</span><progress id="progress" max="1" value="0"></progress><div id="error"></div></div></main>
<footer>WASD／方向鍵移動 · 自動射擊 · 空白鍵 EMP · X 蓄力砲 · P 暫停 · M 音效<br>使用 Unity 製作 · 建議使用電腦瀏覽器遊玩</footer>
<script>
var canvas=document.getElementById('unity-canvas');var instance;
function fail(message){document.getElementById('error').style.display='block';document.getElementById('error').textContent='啟動失敗：'+message+'\n請使用網站網址開啟，勿直接雙擊本機 HTML 檔案。';}
var script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';script.onerror=function(){fail('無法載入 Unity 遊戲檔案');};
script.onload=function(){createUnityInstance(canvas,{dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:'Student Studio',productName:'Starfall Defender',productVersion:'1.0',showBanner:function(message,type){if(type==='error')fail(message);}},function(p){document.getElementById('progress').value=p;}).then(function(game){instance=game;document.getElementById('loading').style.display='none';canvas.focus();}).catch(fail);};document.body.appendChild(script);
document.getElementById('full').onclick=function(){if(instance)instance.SetFullscreen(1);};
window.addEventListener('keydown',function(e){if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)&&document.activeElement===canvas)e.preventDefault();});
</script>
</body></html>
